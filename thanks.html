<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Evan B Etchen</title>
<meta name="description" content="Order confirmed — thank you for supporting Evan B Etchen.">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#1a0b1e;color:#f4f0f7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px;text-align:center;
  }
  .card{
    max-width:440px;width:100%;background:rgba(26,11,30,.9);
    border:1px solid rgba(207,76,255,.45);border-radius:18px;padding:44px 32px;
    box-shadow:0 18px 60px rgba(141,67,255,.18);
  }
  .check{
    width:64px;height:64px;margin:0 auto 20px;border-radius:50%;
    border:2px solid #cf4cff;display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#cf4cff;
  }
  h1{margin:0 0 12px;font-size:26px;letter-spacing:.02em}
  h1 em{color:#cf4cff;font-style:normal}
  p{margin:0 0 28px;font-size:15px;line-height:1.65;color:#b9aec2}
  a.btn{
    display:inline-block;padding:13px 30px;border-radius:999px;text-decoration:none;
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#0b0612;
    background:linear-gradient(120deg,#a855f7,#cf4cff);box-shadow:0 8px 24px rgba(141,67,255,.3);
  }
  a.btn:hover{transform:translateY(-2px)}
  .logo{margin-top:30px;font-size:12px;letter-spacing:.24em;color:#9a8fa3;text-transform:uppercase}
  .logo span{color:#cf4cff}
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Thank <em>you.</em></h1>
    <p>Your order is confirmed. Evan will be in touch about your piece.</p>
    <a class="btn" href="gallery.html">Back to the gallery</a>
    <div class="logo">Evan B <span>Etchen</span></div>
  </div>
</body>
</html>
